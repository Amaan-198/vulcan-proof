olist:
  kaggle_dataset: {value: olistbr/brazilian-ecommerce, unit: str, source: "CITED:kaggle.com/datasets/olistbr/brazilian-ecommerce", sweep: null, rank: null}
  data_dir:       {value: data/olist, unit: path, source: SPEC, sweep: null, rank: null}
  expected_rows: {value: {olist_orders_dataset.csv: 99441, olist_order_items_dataset.csv: 112650, olist_order_reviews_dataset.csv: 99224}, unit: count, source: "CITED:Kaggle dataset listing", sweep: null, rank: null}
  row_count_tolerance: {value: 0.01, unit: ratio, source: SPEC, sweep: null, rank: null}
  required_files: {value: [olist_orders_dataset.csv, olist_order_items_dataset.csv, olist_order_payments_dataset.csv, olist_order_reviews_dataset.csv, olist_products_dataset.csv, olist_customers_dataset.csv, olist_sellers_dataset.csv, product_category_name_translation.csv], unit: list, source: SPEC, sweep: null, rank: null}
  # Label: fulfillment_complaint = 1 if ANY of:
  #  (a) order_status in {delivered} AND review_score <= 2 AND order_delivered_customer_date > order_estimated_delivery_date
  #  (b) order_status in {delivered} AND review_score <= 2 AND review_comment_message matches complaint_regex
  #  (c) order_status in {shipped, approved, processing, invoiced} AND purchase_date + not_delivered_days < dataset_end
  # else 0. Orders with status canceled/unavailable/created are EXCLUDED (not prepaid-fulfilled).
  label:
    low_score_max:       {value: 2, unit: score, source: SPEC, sweep: null, rank: null}
    not_delivered_days:  {value: 60, unit: days, source: SPEC, sweep: null, rank: null}
    complaint_regex:     {value: "n[aã]o recebi|nao chegou|não chegou|produto errado|veio errado|diferente do anunci|vazio|quebrad|danificad|nunca chegou|não entregue|nao entregue", unit: regex_pt, source: SPEC, sweep: null, rank: null}
    dataset_end:         {value: "2018-10-17", unit: date, source: "CITED:dataset span 2016-09..2018-10", sweep: null, rank: null}
  split:   # by order_purchase_timestamp; maturity: exclude last maturity_days before dataset_end
    train_end:      {value: "2018-02-28", unit: date, source: SPEC, sweep: null, rank: null}
    validate_end:   {value: "2018-05-31", unit: date, source: SPEC, sweep: null, rank: null}
    maturity_days:  {value: 75, unit: days, source: SPEC, sweep: null, rank: null}   # 60 not-delivered + 15 review lag
  features:
    permitted: {value: [price_total, freight_total, n_items, n_sellers, product_category_en, product_weight_g, product_volume_cm3, product_photos_qty, product_description_length, payment_type, payment_installments, customer_state, seller_state, same_state, purchase_month, purchase_dow, purchase_hour, seller_prior_orders, seller_prior_complaint_rate, customer_prior_orders], unit: list, source: SPEC, sweep: null, rank: null}
    forbidden: {value: [order_status, order_delivered_customer_date, order_delivered_carrier_date, order_estimated_delivery_date, order_approved_at, review_score, review_comment_message, review_comment_title, review_creation_date, shipping_limit_date], unit: list, source: SPEC, sweep: null, rank: null}
  prior_shrinkage_n: {value: 20, unit: count, source: SPEC, sweep: null, rank: null}
  operating_recalls: {value: [0.3, 0.5, 0.7], unit: list, source: SPEC, sweep: null, rank: null}
  fp_cost_proxy_seconds: {value: 70, unit: seconds, source: "SPEC — four pre-dispatch items", sweep: null, rank: null}

