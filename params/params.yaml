# ---------------------------------------------------------------------------
# Archetypes. policy = {evidence: min_order_value}; "random" = uniform random subset each order.
# Every evidence type appears in ≥1 policy (identifiability, see 00_context §6).
archetypes:
  order: {value: [Diligent, HandoffHeavy, PhotoPref, AckFirst, Minimal, Erratic], unit: list, source: SPEC, sweep: null, rank: null}
  Diligent:     {share: 0.15, compliance: 0.90, contest: 0.85, quality_rank: 6, policy: {weight: 0, packing: 0, serial: 0, otp: 25000}}
  HandoffHeavy: {share: 0.15, compliance: 0.85, contest: 0.75, quality_rank: 5, policy: {geotag: 0, otp: 15000, signature: 50000}}
  PhotoPref:    {share: 0.15, compliance: 0.85, contest: 0.65, quality_rank: 4, policy: {sealed: 0, packing: 0}}
  AckFirst:     {share: 0.15, compliance: 0.80, contest: 0.60, quality_rank: 3, policy: {ack: 0, vack: 10000}}
  Minimal:      {share: 0.30, compliance: 0.95, contest: 0.50, quality_rank: 2, policy: {}}
  Erratic:      {share: 0.10, compliance: 0.30, contest: 0.35, quality_rank: 1, policy: random}
  _meta: {source: "SPEC §8.6 (v9 redesign). Shares are of MERCHANTS. quality_rank 1 = worst (highest hidden_quality fault multiplier); merchants sorted worst→best are assigned archetypes in contiguous blocks by rank so shares are exact and quality-confounded.", sweep: null}
  random_stratum_frac:   {value: 0.05, unit: ratio, source: SPEC, sweep: [0.0, 0.05], rank: 15}  # 0.0 = pure-observational robustness run
  contest_evidence_slope: {value: 0.06, unit: logit_per_evidence_held, source: ASSUMED, sweep: [0.0, 0.15], rank: 5}
  ack_optin_rate:        {value: 0.70, unit: ratio, source: ASSUMED, sweep: [0.5, 0.9], rank: 16}

merchants:
  n_merchants:            {value: 6000, unit: count, source: SPEC, sweep: null, rank: null}
  size_lognormal_sigma:   {value: 1.2,  unit: ratio, source: SPEC, sweep: null, rank: null}
  quality_lognormal_sigma: {value: 0.5, unit: ratio, source: SPEC, sweep: null, rank: null}  # merchant-fault multiplier; mean-normalised
  tier_full:              {value: 0.55, unit: ratio, source: SPEC, sweep: [0.3, 0.8], rank: 17}
  tier_post_delivery_only: {value: 0.30, unit: ratio, source: SPEC, sweep: null, rank: null}  # remainder = NONE

# ---------------------------------------------------------------------------
sim:
  truth_base_rate:  # per order, before merchant-quality / fragility multipliers; mean-normalised so population rates hold
    misdelivered:     {value: 0.0020, unit: ratio, source: SPEC, sweep: [0.001, 0.003], rank: 18}
    never_handed_off: {value: 0.0025, unit: ratio, source: SPEC, sweep: [0.00125, 0.00375], rank: 18}
    merchant_fault:   {value: 0.0045, unit: ratio, source: SPEC, sweep: [0.00225, 0.00675], rank: 18}
    transit_damage:   {value: 0.0055, unit: ratio, source: SPEC, sweep: [0.00275, 0.00825], rank: 18}
  fragility_effect: {value: 1.0, unit: log_multiplier_at_fragility_1, source: SPEC, sweep: null, rank: null}  # transit_damage *= exp(fragility_effect*(fragility-0.4))
  customer_response:   # [confirm, report, silent]; only elicited if an ack was actually sent
    delivered_correct: {value: [0.60, 0.02, 0.38], unit: ratio, source: SPEC, sweep: null, rank: null}
    merchant_fault_or_damage: {value: [0.05, 0.70, 0.25], unit: ratio, source: SPEC, sweep: null, rank: null}
    not_received:      {value: [0.08, 0.65, 0.27], unit: ratio, source: SPEC, sweep: null, rank: null}
  verified_ack_response_penalty: {value: 0.15, unit: pp, source: SPEC, sweep: null, rank: null}
  # Dispute funnel (DERIVED, see docs/phase_1 §7). Six unknowns, six targets:
  #   gamma[cat]  — category escalation weight, solved so each category's potential-dispute rate hits categories.<cat>.target_rate
  #   theta       — false-claim propensity, solved so the population share of GENUINE-failure disputes = genuine_share_target
  # Population dispute rate is then implied (≈0.29%) and REPORTED, not targeted.
  genuine_share_target: {value: 0.35, unit: ratio, source: "ASSUMED — complement of reference.phi (0.65 share vs correct fulfillment)", sweep: [0.20, 0.50], rank: 4}
  theta:        {value: null, unit: ratio, source: "DERIVED by bisection on canonical seed; stored in outputs/theta.json; FIXED thereafter", sweep: null, rank: null}
  gamma:        {value: null, unit: dict, source: "DERIVED per category, same file", sweep: null, rank: null}
  theta_search: {value: [0.0001, 0.2], unit: ratio, source: SPEC, sweep: null, rank: null}
  gamma_search: {value: [0.001, 20.0], unit: ratio, source: SPEC, sweep: null, rank: null}
  calibration_rel_tol: {value: 0.01, unit: ratio, source: SPEC, sweep: null, rank: null}
  false_claim_value_elasticity: {value: 0.3, unit: ratio, source: ASSUMED, sweep: [0.0, 0.6], rank: 19}  # both channels ∝ (V/value_ref)^elasticity
  false_claim_value_ref: {value: 10000, unit: INR, source: SPEC, sweep: null, rank: null}
  fragility_ref: {value: 0.4, unit: ratio, source: SPEC, sweep: null, rank: null}
  deterrence:    {value: 0.0, unit: ratio, source: SPEC, sweep: [0.0, 0.2], rank: 20}  # HEADLINE 0 — non-zero makes Stage A circular
  silence_yield: {value: 0.0, unit: pp,    source: SPEC, sweep: [0.0, 0.10], rank: 20}
  # Latency (days). Visa 13.1: 120d from expected delivery; merchant response 30d.
  latency:
    expected_delivery_days:   {value: 7,   unit: days, source: SPEC, sweep: null, rank: null}
    dispute_fast_share:       {value: 0.60, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    dispute_fast_max_days:    {value: 45,  unit: days, source: ASSUMED_FIXED, sweep: null, rank: null}
    dispute_max_days:         {value: 120, unit: days, source: "CITED:Visa 13.1 issuer window", sweep: null, rank: null}
    response_days:            {value: 30,  unit: days, source: "CITED:Visa/Razorpay merchant response window", sweep: null, rank: null}
    resolution_lognormal_median_days: {value: 35, unit: days, source: ASSUMED_FIXED, sweep: null, rank: null}
    resolution_lognormal_p95_days:    {value: 90, unit: days, source: ASSUMED_FIXED, sweep: null, rank: null}
  timeline:   # month m spans days [days_per_month·(m-1), days_per_month·m)
    days_per_month:        {value: 30, unit: days, source: SPEC, sweep: null, rank: null}
    order_months:          {value: [1, 30], unit: months, source: SPEC, sweep: null, rank: null}
    decision_month_end:    {value: 26, unit: month, source: SPEC, sweep: null, rank: null}
    train_months:          {value: [1, 14], unit: months, source: SPEC, sweep: null, rank: null}
    validate_months:       {value: [15, 18], unit: months, source: SPEC, sweep: null, rank: null}
    gap_months:            {value: [19, 26], unit: months, source: SPEC, sweep: null, rank: null}
    test_months:           {value: [27, 30], unit: months, source: SPEC, sweep: null, rank: null}
    outcome_observed_through_month: {value: 39, unit: month, source: SPEC, sweep: null, rank: null}
  max_censor_frac:   {value: 0.03, unit: ratio, source: SPEC, sweep: null, rank: null}   # train/validate; test reports its own
  # κ dial: individual-risk signal strength. risk_mult = exp(κ·z_risk − κ²/2); NR-share logit += κ·type_shift·z_type
  kappa:
    grid:        {value: [0.0, 0.6], unit: list, source: SPEC, sweep: null, rank: null}
    canonical:   {value: 0.6, unit: ratio, source: SPEC, sweep: null, rank: null}
    type_shift:  {value: 0.8, unit: logit, source: ASSUMED, sweep: [0.4, 1.2], rank: 3}
    # z_risk = standardise(c_new·new_customer + c_addr·address_mismatch + c_prior·log1p(prior_disputes)
    #                       − c_age·log1p(account_age_days/30) + c_noise·N(0,1))
    coef_new_customer:   {value: 0.8, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    coef_address_mismatch: {value: 1.0, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    coef_prior_disputes: {value: 1.2, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    coef_account_age:    {value: 0.4, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    coef_noise:          {value: 1.0, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}  # irreducible; keeps Stage A from being an oracle
    # z_type = standardise(address_mismatch + 0.5·new_customer + noise)
  customer_features:
    p_new_customer:      {value: 0.35, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    p_address_mismatch:  {value: 0.08, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
    prior_disputes_poisson_mean: {value: 0.05, unit: count, source: ASSUMED_FIXED, sweep: null, rank: null}
    account_age_lognormal_median_days: {value: 400, unit: days, source: ASSUMED_FIXED, sweep: null, rank: null}
  n_carriers: {value: 3, unit: count, source: SPEC, sweep: null, rank: null}
  carrier_reliability_sigma: {value: 0.3, unit: log_multiplier, source: SPEC, sweep: null, rank: null}
  n_issuer_families: {value: 6, unit: count, source: SPEC, sweep: null, rank: null}
  network_visa_share: {value: 0.55, unit: ratio, source: ASSUMED_FIXED, sweep: null, rank: null}
  # World D (distribution shift): applied to test months only when enabled
  shift:
    enabled_default:  {value: false, unit: flag, source: SPEC, sweep: null, rank: null}
    category_share_shift: {value: {Electronics: 0.30, Jewellery: 0.05, Apparel: 0.25, Home: 0.15, FMCG: 0.25}, unit: ratio, source: SPEC, sweep: null, rank: null}
    risk_coef_multiplier: {value: 0.7, unit: ratio, source: SPEC, sweep: null, rank: null}

