# ---------------------------------------------------------------------------
# Evidence catalogue. presence_factor = probability the customer/artefact condition is met
# given merchant compliance (OTP/signature need customer present; acks need a response).
# cost_timing: cash → on compliance; seconds → on request.  api_slot = Razorpay contest-API field.
evidence:
  order: {value: [weight, serial, sealed, packing, geotag, otp, signature, ack, vack], unit: list, source: SPEC, sweep: null, rank: null}
  weight:    {cash: 0,    seconds: 5,  presence_factor: 1.00, system_sent: false, window: pre_dispatch, admissible: [NAD, EB],     api_slot: others}
  serial:    {cash: 0,    seconds: 15, presence_factor: 1.00, system_sent: false, window: pre_dispatch, admissible: [NAD, EB],     api_slot: billing_proof}
  sealed:    {cash: 0,    seconds: 20, presence_factor: 1.00, system_sent: false, window: pre_dispatch, admissible: [NAD, EB],     api_slot: shipping_proof}
  packing:   {cash: 0,    seconds: 30, presence_factor: 1.00, system_sent: false, window: pre_dispatch, admissible: [NAD, EB],     api_slot: others}
  geotag:    {cash: 8,    seconds: 0,  presence_factor: 1.00, system_sent: false, window: handoff,      admissible: [NR],          api_slot: shipping_proof}
  otp:       {cash: 25,   seconds: 0,  presence_factor: 0.90, system_sent: false, window: handoff,      admissible: [NR],          api_slot: proof_of_service}
  signature: {cash: 40,   seconds: 0,  presence_factor: 0.90, system_sent: false, window: handoff,      admissible: [NR],          api_slot: "others:receipt_signed_by_customer"}
  ack:       {cash: 0.30, seconds: 0,  presence_factor: 0.60, system_sent: true,  window: post_delivery, admissible: [NR],         api_slot: customer_communication}
  vack:      {cash: 0.30, seconds: 0,  presence_factor: 0.45, system_sent: true,  window: post_delivery, admissible: [NR, NAD, EB], api_slot: customer_communication}
  _meta: {source: "SPEC §6; presence 0.90 ASSUMED; ack responses from §8.8 (0.60 basic, verified −15pp); api_slot from razorpay.com/docs/api/disputes/contest", sweep: null}
  customer_presence_sweep: {value: 0.90, unit: ratio, source: "ASSUMED — Phase 4 writes this value into presence_factor of otp AND signature before generation", sweep: [0.75, 0.98], rank: 8}

# ---------------------------------------------------------------------------
# TRUE uplifts (pp of win probability on disputes against CORRECT fulfillment). HIDDEN from optimizer.
# These were NOT in the design. They are ASSUMED and are sensitivity rank 1. Sweep as a global
# multiplier on each block (uplift.sweep_multiplier) AND the ack/OTP ratio separately.
uplift_true:
  NR:  {otp: 0.40, signature: 0.35, geotag: 0.20, vack: 0.20, ack: 0.16}
  NAD: {packing: 0.25, serial: 0.15, sealed: 0.10, weight: 0.05, vack: 0.10}
  EB:  {weight: 0.30, packing: 0.20, sealed: 0.15, serial: 0.10, vack: 0.08}
  _meta: {source: "ASSUMED. ack = 0.4×OTP anchored to Visa 2021 dispute-rule clarification (issuer must address evidence of receipt at agreed location). Others: relative strength judgement only.", sweep: "see sweep_multiplier and ack_otp_ratio"}
  sweep_multiplier: {value: 1.0, unit: ratio, source: ASSUMED, sweep: [0.5, 1.5], rank: 1}
  ack_otp_ratio:    {value: 0.40, unit: ratio, source: ASSUMED, sweep: [0.2, 0.8], rank: 1}
  # Truth-conditional modifiers (hidden). Applied multiplicatively to the block above.
  on_merchant_fault:     {value: -1.0, unit: ratio, source: SPEC, sweep: null, rank: null}   # packing/weight convict the merchant
  on_transit_damage:     {value: 1.0,  unit: ratio, source: SPEC, sweep: null, rank: null}   # pre-dispatch exonerates
  on_never_handed_off:   {value: 0.0,  unit: ratio, source: SPEC, sweep: null, rank: null}   # handoff artefact cannot exist
  on_misdelivered_otp:   {value: 0.0,  unit: ratio, source: SPEC, sweep: [0.0, 0.5], rank: 13} # HEADLINE 0; carrier-fault sweep only

overlap: # set uplift = max + (1-rho) * sum(rest), capped at 1 - base_win
  NR:  {value: 0.55, unit: ratio, source: SPEC, sweep: [0.2, 0.7], rank: 7}
  NAD: {value: 0.35, unit: ratio, source: SPEC, sweep: [0.2, 0.7], rank: 7}
  EB:  {value: 0.30, unit: ratio, source: SPEC, sweep: [0.2, 0.7], rank: 7}

base_win: # tracking-only, contested
  NR:  {value: 0.25, unit: ratio, source: SPEC, sweep: [0.15, 0.35], rank: 14}
  NAD: {value: 0.20, unit: ratio, source: SPEC, sweep: [0.10, 0.30], rank: 14}
  EB:  {value: 0.15, unit: ratio, source: SPEC, sweep: [0.08, 0.25], rank: 14}

