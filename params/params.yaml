# =============================================================================
# Vulcan Proof — THE parameter file. Every constant in the project lives here.
#
# Schema for every leaf parameter:
#   value:  the number/string/list actually used
#   unit:   physical unit or "ratio"/"count"/"flag"
#   source: SPEC (design decision) | CITED:<ref> | ASSUMED (must be swept, rank required)
#           | ASSUMED_FIXED (structural assumption deliberately not swept; the κ dial or a robustness run covers its effect)
#           | DERIVED (output, never input)
#   sweep:  null (never swept) | [lo, hi] | list of discrete levels
#   rank:   sensitivity rank for Phase 4 sweep ordering (1 = first). null if not swept.
#
# The loader (vulcan_proof/params.py) rejects: missing fields, unknown keys, access to absent keys,
# any parameter whose source starts with "ASSUMED" (exact tag ASSUMED) but sweep is null, and any
# source string that is not one of the five tags (optionally followed by ":" or " — " and free text).
# =============================================================================

run:
